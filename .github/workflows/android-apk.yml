name: DIGO Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/digogame-production-postgres]

permissions:
  contents: read

concurrency:
  group: digo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Install temporary Capacitor 8 toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK and release bundle
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are not configured; producing debug APK and unsigned release AAB only."
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/digo-release.keystore"
          test -s "$RUNNER_TEMP/digo-release.keystore"
          echo "DIGO_KEYSTORE_PATH=$RUNNER_TEMP/digo-release.keystore" >> "$GITHUB_ENV"
          echo "DIGO_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DIGO_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DIGO_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign release APK and verify certificate
        if: ${{ env.DIGO_KEYSTORE_PATH != '' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" sign --ks "$DIGO_KEYSTORE_PATH" --ks-key-alias "$DIGO_KEY_ALIAS" --ks-pass "pass:$DIGO_KEYSTORE_PASSWORD" --key-pass "pass:$DIGO_KEY_PASSWORD" --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release-signed.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release-signed.apk
          jarsigner -keystore "$DIGO_KEYSTORE_PATH" -storepass "$DIGO_KEYSTORE_PASSWORD" -keypass "$DIGO_KEY_PASSWORD" -signedjar app/build/outputs/bundle/release/app-release-signed.aab app/build/outputs/bundle/release/app-release.aab "$DIGO_KEY_ALIAS"
          jarsigner -verify -strict -certs app/build/outputs/bundle/release/app-release-signed.aab

      - name: Upload signed release APK
        if: ${{ env.DIGO_KEYSTORE_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: digo-evolution-release-apk-signed
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIGO_KEYSTORE_PATH != '' && 'digo-evolution-release-aab-signed' || 'digo-evolution-release-aab-unsigned' }}
          path: ${{ env.DIGO_KEYSTORE_PATH != '' && 'android/app/build/outputs/bundle/release/app-release-signed.aab' || 'android/app/build/outputs/bundle/release/app-release.aab' }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: digo-evolution-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
