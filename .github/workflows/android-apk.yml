name: DIGO Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/digogame-production-postgres]

permissions:
  contents: read

concurrency:
  group: digo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Install temporary Capacitor 8 toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK and release bundle
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload release bundle (unsigned until release keystore is configured)
        uses: actions/upload-artifact@v4
        with:
          name: digo-evolution-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: digo-evolution-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
