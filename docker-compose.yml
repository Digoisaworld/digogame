services:
  digo-game:
    build:
      context: .
      dockerfile: Dockerfile
    image: digo-game:production
    container_name: digo-game
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      RUN_SECRET: ${RUN_SECRET:?Set RUN_SECRET in the VPS .env file}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the VPS .env file}
    networks:
      - digogame-net
    ports:
      - "127.0.0.1:${HOST_PORT:-3100}:3000"
    volumes:
      - digo-game-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  digogame-net:
    external: true
    name: digogame-net

volumes:
  digo-game-data:
    name: digo-game-data
